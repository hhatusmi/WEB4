
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book a Train Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="task1.css">
</head>
<body>
<main class="ticket-wrap container py-4 py-lg-5">
    <section class="ticket-card mx-auto">
        <header class="ticket-header">
            <h1>Book a train ticket</h1>
        </header>

        <form class="ticket-form" action="#" method="get">
            <fieldset class="mb-4">
                <legend class="visually-hidden">Trip type</legend>
                <div class="trip-switch">
                    <input class="btn-check" type="radio" name="trip" id="one-way" value="one-way" checked>
                    <label class="btn" for="one-way">One way</label>
                    <input class="btn-check" type="radio" name="trip" id="round-trip" value="round-trip">
                    <label class="btn" for="round-trip">Round trip</label>
                </div>
            </fieldset>

            <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                    <label for="from" class="form-label">From</label>
                    <input class="form-control" type="text" id="from" name="from" value="Astana" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="to" class="form-label">To</label>
                    <input class="form-control" type="text" id="to" name="to" value="Almaty" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-12 col-md-4">
                    <label for="departure" class="form-label">Departure</label>
                    <input type="date" class="form-control" id="departure" name="departure" required>
                </div>
                <div class="col-12 col-md-4">
                    <label for="return" class="form-label">Return</label>
                    <input type="date" class="form-control" id="return" name="return">
                </div>
                <div class="col-12 col-md-4">
                    <label for="passengers" class="form-label">Passengers</label>
                    <select class="form-select" id="passengers" name="passengers" required>
                        <option value="1" selected>1 adult</option>
                        <option value="2">2 adults</option>
                        <option value="3">3 adults</option>
                        <option value="4">4 adults</option>
                        <option value="5">5 adults</option>
                        <option value="6">6 adults</option>
                    </select>
                </div>
            </div>

            <fieldset class="mb-3">
                <legend class="form-label">Carriage class</legend>
                <div class="class-options">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="class" id="seat" value="seat">
                        <label class="form-check-label" for="seat">Seat</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="class" id="coupe" value="coupe" checked required>
                        <label class="form-check-label" for="coupe">Coupé</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="class" id="sleeper" value="sleeper">
                        <label class="form-check-label" for="sleeper">Sleeper</label>
                    </div>
                </div>
            </fieldset>

            <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                    <label for="phone" class="form-label">Phone</label>
                    <div class="input-group">
                        <span class="input-group-text">+7</span>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" required>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="sms" name="sms" value="yes">
                <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="agreement" name="agreement" value="yes" required>
                <label class="form-check-label" for="agreement">I agree with the carriage rules</label>
            </div>

            <div class="form-actions">
                <button type="reset" class="btn btn-clear">Clear</button>
                <button type="submit" class="btn btn-find">Find trains</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
