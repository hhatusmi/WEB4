
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reserve a Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container py-4 py-lg-5">
    <div class="simple-card mx-auto">
        <h1 class="h2 mb-2">Reserve a table</h1>
        <p class="text-secondary mb-4">Complete the form and we will confirm your reservation.</p>

        <form action="#" method="get">
            <div class="mb-3">
                <label for="guest-name" class="form-label">Your name</label>
                <input class="form-control" type="text" id="guest-name" name="guest-name" autocomplete="name" required>
            </div>

            <div class="mb-3">
                <label for="guest-email" class="form-label">Email</label>
                <input class="form-control" type="email" id="guest-email" name="guest-email" autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label for="guest-phone" class="form-label">Phone</label>
                <input class="form-control" type="tel" id="guest-phone" name="guest-phone" autocomplete="tel" required>
            </div>

            <div class="row g-3">
                <div class="col-12 col-md-6 mb-3">
                    <label for="guests" class="form-label">Guests</label>
                    <input class="form-control" type="number" id="guests" name="guests" min="1" max="12" step="1" value="2" required>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <label for="reservation-date" class="form-label">Date</label>
                    <input class="form-control" type="date" id="reservation-date" name="reservation-date" required>
                </div>
            </div>

            <fieldset class="mb-3">
                <legend class="form-label">Seating preference</legend>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="inside" name="seating" value="inside" required>
                    <label class="form-check-label" for="inside">Inside</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="terrace" name="seating" value="terrace">
                    <label class="form-check-label" for="terrace">Terrace</label>
                </div>
            </fieldset>

            <div class="mb-3">
                <label for="meal" class="form-label">Meal time</label>
                <select class="form-select" id="meal" name="meal" required>
                    <option value="" selected disabled>Choose a time</option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="comments" class="form-label">Comments (optional)</label>
                <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                <label class="form-check-label" for="terms">I agree to the reservation terms</label>
            </div>

            <button class="btn btn-brand w-100" type="submit">Reserve</button>
        </form>
    </div>
</main>
</body>
</html>
